name: 三年策略回測

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 還原歷史資料快取
        uses: actions/cache@v4
        with:
          path: |
            work/finmind
            work/finmind_revenue
          key: finmind-twse-three-year-v2
          restore-keys: |
            finmind-twse-three-year-v1
      - name: 執行三年回測
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python backtest.py
      - name: 發布回測報告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest.json docs/backtest.html
          git commit -m "更新三年回測結果"
          git push
