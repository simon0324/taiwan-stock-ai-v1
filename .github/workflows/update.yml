name: 每日更新選股

on:
  schedule:
    - cron: "50 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 執行回歸測試
        run: python -m unittest discover -s tests -v
      - name: 產生最新選股頁面
        run: python app.py
      - name: 產生獨立消息加分版
        run: python event_news.py
      - name: 產生公告與單月 EPS 觀察表
        run: python eps_observer.py
      - name: 產生免費國際事件雷達
        run: python global_events.py
      - name: 產生國際事件個股加權與追蹤
        run: python international_rank.py
      - name: 儲存更新結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "自動更新選股結果"
          git push
